services:
  # One-shot init: fixes ownership of the named volume's mount point before
  # the app starts. Docker creates a brand-new named volume's mount point
  # owned by root:root, but the app container runs as the distroless image's
  # non-root uid 65532 (which has no shell to chown from inside), so without
  # this the app can write nothing to /data — config saves fail silently
  # (a bug in the upstream app itself, see AI.md §2.5) and every account you
  # add vanishes on the next `docker compose up`.
  #
  # Runs, and re-runs, on every `docker compose up` — chown on
  # already-correctly-owned files is a fast no-op, so this is safe and cheap
  # to always run rather than being a manual first-time-only step.
  init-permissions:
    image: alpine:latest
    container_name: gotohp-init-permissions
    command: chown -R 65532:65532 /data
    volumes:
      - gotohp-data:/data
    restart: "no"

  gotohp:
    build:
      context: .
      dockerfile: build/docker/Dockerfile.server
      args:
        CGO_ENABLED: "0"
    image: gotohp:latest
    container_name: gotohp
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    ports:
      # Host port picked to avoid the common 8080/3000/etc. collisions on a
      # shared VPS; override with GOTOHP_PORT=<port> docker compose up -d if
      # this one's taken too. Container-internal port stays 8080.
      - "${GOTOHP_PORT:-48080}:8080"
    environment:
      WAILS_SERVER_HOST: "0.0.0.0"
      # The distroless runtime user (uid 65532) has no $HOME set, and
      # os.UserConfigDir() (backend/configmanager.go) hard-fails if neither
      # $HOME nor $XDG_CONFIG_HOME is defined. Pin it explicitly so config
      # (accounts, settings) resolves to the mounted volume below instead of
      # crashing on startup.
      XDG_CONFIG_HOME: "/data"
      # Optional access-token protection for server mode. Uncomment and set
      # to protect the app (it's reachable by anyone who reaches this URL
      # otherwise). Same shape as the Cloudflare Worker rewrite's
      # APP_ACCESS_TOKEN: a single token, checked via the browser's native
      # HTTP Basic Auth prompt (leave the username field blank, put the
      # token in the password field).
      # GOTOHP_ACCESS_TOKEN: "changeme"
    volumes:
      - gotohp-data:/data

volumes:
  gotohp-data:
